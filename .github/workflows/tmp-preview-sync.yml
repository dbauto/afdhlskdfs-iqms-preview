# Temporary, branch-only: rebuilds the Pages preview for this PR because the agent session can't reach npm.
# Removed again before merge.
name: Temporary preview sync
on:
  push:
    branches: [feat/readiness-grant-access-requests-uploads]
    paths: [".github/workflows/tmp-preview-sync.yml"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:preview
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q ../.github/workflows/tmp-preview-sync.yml
          git add ../index.html ../docs/index.html
          git commit -m "Rebuild Pages preview for ADR-037" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push
