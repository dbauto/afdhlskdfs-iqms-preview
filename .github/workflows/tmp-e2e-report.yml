# Temporary, branch-only: reports e2e failures as annotations (the agent session can't read job logs). Removed before merge.
name: Temporary e2e report
on:
  push:
    branches: [feat/readiness-grant-access-requests-uploads]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=2 --reporter=github,line 2>&1 | tee e2e.txt; grep -E "^\s+[0-9]+\) |Error:|expect\(|Expected|Received|Timeout|waiting for|Locator" e2e.txt | head -60 | while IFS= read -r l; do echo "::warning title=e2e::$l"; done
