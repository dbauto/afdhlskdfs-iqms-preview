name: PR52 sync main and rebuild Pages preview (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr52-sync-preview.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/route-loading-skeletons-20261024
          fetch-depth: 0
          persist-credentials: true
      - name: Merge updated main into the PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Rebuild current hash preview
        run: npm run build:preview
      - name: Verify browser previews and collect visual evidence
        run: |
          npx playwright install --with-deps chromium
          npm run verify:branding
          npm run verify:preview
          cmp ../index.html ../docs/index.html
          node scripts/capture-pr52.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr52-synced-screenshots
          path: app/test-results/pr52-screenshots/
          retention-days: 30
      - name: Commit generated previews and remove temporary workflow
        run: |
          git add index.html docs/index.html
          git rm .github/workflows/pr52-sync-preview.yml
          git commit -m "Rebuild PR52 preview against latest main and remove temporary workflow"
          git push origin HEAD:refs/heads/ui/route-loading-skeletons-20261024
        working-directory: .
