name: Temporary preview rebuild (ADR-042 branch only)
on:
  push:
    branches: [feat/console-workflow-gaps]
permissions:
  contents: write
jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git pull --rebase origin feat/console-workflow-gaps || true
        working-directory: .
- run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:preview
      - name: Commit refreshed preview
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html
          git diff --cached --quiet || (git commit -m "build(preview): refresh GitHub Pages HTML for ADR-042" && git pull --rebase && git push)
