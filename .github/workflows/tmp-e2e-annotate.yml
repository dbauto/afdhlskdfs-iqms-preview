# Temporary, branch-only: reports e2e failures as annotations (the coding session can't download logs). Deleted before merge.
name: Temporary e2e annotations
on:
  push:
    branches: ["feat/branding-logos"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=2 --reporter=github
