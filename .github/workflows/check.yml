name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: TEMP push builds for local verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          rm -rf /tmp/out && mkdir -p /tmp/out/app-dist /tmp/out/preview
          cp -r dist/. /tmp/out/app-dist/
          npm run build:preview
          cp ../index.html /tmp/out/preview/index.html
          rm -rf dist && cp -r /tmp/out/app-dist dist
          cd /tmp/out
          git init -q -b tmp
          git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -q -m "builds for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" tmp:refs/heads/tmp/audit-builds
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end, permissions and responsive UI
        run: npm run e2e -- --workers=2
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-test-evidence
          path: app/test-results/
          retention-days: 30
