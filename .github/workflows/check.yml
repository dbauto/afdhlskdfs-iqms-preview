name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end, permissions and responsive UI
        run: npm run e2e -- --workers=2
      - name: Verify Pages preview is current
        run: |
          npm run build:preview
          cmp ../index.html ../docs/index.html
          git diff --exit-code -- ../index.html ../docs/index.html
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-test-evidence
          path: app/test-results/
          retention-days: 30
