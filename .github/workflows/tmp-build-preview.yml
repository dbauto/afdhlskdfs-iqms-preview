# Temporary, branch-only: rebuilds the Pages preview because the coding session can't reach npm. Deleted before merge.
name: Temporary preview build
on:
  push:
    branches: ["feat/branding-logos"]
    paths-ignore: ["index.html", "docs/index.html"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:preview
      - name: Commit rebuilt preview
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html
          git diff --cached --quiet || git commit -m "build(preview): rebuild Pages preview for branding logos"
          git push
