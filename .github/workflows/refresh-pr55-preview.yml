name: Refresh PR 55 Pages HTML

on:
  push:
    branches:
      - ui/collapsible-clause-search-navigation-20261024

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'dbauto/afdhlskdfs-iqms-preview' && github.ref == 'refs/heads/ui/collapsible-clause-search-navigation-20261024'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application packages
        run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Generate single-file hash preview
        run: npm run build:preview
        working-directory: app
      - name: Commit preview to feature branch only
        run: |
          if git diff --quiet -- index.html docs/index.html; then
            echo "Pages preview already matches app source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html
          git commit -m "build: regenerate preview for PR 55"
          git push origin HEAD:refs/heads/ui/collapsible-clause-search-navigation-20261024
