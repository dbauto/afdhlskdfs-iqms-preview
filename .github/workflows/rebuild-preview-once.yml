name: Rebuild preview (temporary, PR #73)

on:
  push:
    branches: [feat/management-review-any-topic]
    paths: [".github/workflows/rebuild-preview-once.yml"]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/management-review-any-topic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:preview
      - name: Commit the rebuilt preview and remove this workflow
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/rebuild-preview-once.yml
          git add index.html docs/index.html
          git commit -m "Rebuild Pages preview"
          git push origin HEAD:feat/management-review-any-topic
